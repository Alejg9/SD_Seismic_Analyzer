services:
  seismic_analyzer:
    build: .
    devices:
      - /dev/kfd
      - /dev/dri

    volumes:
      - ./app:/app/
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=10240

    command: ["streamlit", "run", "main.py"]